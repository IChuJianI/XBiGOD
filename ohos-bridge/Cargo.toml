[package]
name = "xbigod-ohos-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
name = "xbigod_core"

[dependencies]
iso2god-src = { package = "iso2god", git = "https://github.com/iliazeus/iso2god-rs", rev = "06635a11fc295d167765fc7dcd5cc162eef122b3" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
lzxd = "0.2"
aes = "0.9"
cbc = "0.2"

[profile.release]
strip = true
lto = true
